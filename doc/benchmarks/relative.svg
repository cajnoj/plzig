<text x="387.59999999999997" y="48" class="lab">PL/Zig (exec)</text>
<rect x="491.2" y="39" width="10" height="10" class="s-plzig" stroke-width="2"/>
<text x="505.2" y="48" class="lab">PL/Zig (text)</text>
