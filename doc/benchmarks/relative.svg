<line x1="603.3" y1="62" x2="603.3" y2="390" class="grid"/>
<text x="603.3" y="406" text-anchor="middle">1×</text>
<line x1="659.5" y1="62" x2="659.5" y2="390" class="grid" stroke-dasharray="2 3"/>
<line x1="733.8" y1="62" x2="733.8" y2="390" class="grid" stroke-dasharray="2 3"/>
