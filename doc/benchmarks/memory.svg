<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 408" width="820" height="408" role="img" aria-labelledby="t d">
<title id="t">Peak memory increase per backend, PostgreSQL 18.7</title>
<desc id="d">Horizontal bars: increase of VmHWM during one run of the task, MB, per implementation.</desc>
<style>
  text { font-family: system-ui, -apple-system, 'Segoe UI', 'DejaVu Sans', sans-serif; font-size: 12px; }
  .t { font-size: 14px; font-weight: 600; }
  .bg { fill: #fcfcfb; }
  .ring { stroke: #fcfcfb; stroke-width: 2; }
  text { fill: #52514e; }
  .t, .lab { fill: #0b0b0b; }
  .grid { stroke: #e4e3df; stroke-width: 1; }
  .axis { stroke: #52514e; stroke-width: 1; }
  .f-sql { fill: #2a78d6; } .s-sql { stroke: #2a78d6; fill: none; }
  .f-plpgsql { fill: #eb6834; } .s-plpgsql { stroke: #eb6834; fill: none; }
  .f-plpython { fill: #1baf7a; } .s-plpython { stroke: #1baf7a; fill: none; }
  .f-plperl { fill: #eda100; } .s-plperl { stroke: #eda100; fill: none; }
  .f-plzig { fill: #e87ba4; } .s-plzig { stroke: #e87ba4; fill: none; }
  @media (prefers-color-scheme: dark) {
  .bg { fill: #1a1a19; }
  .ring { stroke: #1a1a19; stroke-width: 2; }
  text { fill: #c3c2b7; }
  .t, .lab { fill: #f0efec; }
  .grid { stroke: #3a3a37; stroke-width: 1; }
  .axis { stroke: #c3c2b7; stroke-width: 1; }
  .f-sql { fill: #3987e5; } .s-sql { stroke: #3987e5; fill: none; }
  .f-plpgsql { fill: #d95926; } .s-plpgsql { stroke: #d95926; fill: none; }
  .f-plpython { fill: #199e70; } .s-plpython { stroke: #199e70; fill: none; }
  .f-plperl { fill: #c98500; } .s-plperl { stroke: #c98500; fill: none; }
  .f-plzig { fill: #d55181; } .s-plzig { stroke: #d55181; fill: none; }
  }
</style>
<rect width="820" height="408" class="bg"/>
<text x="16" y="24" class="t">Peak memory increase per backend, PostgreSQL 18.7</text>
<circle cx="21" cy="44" r="5" class="f-sql"/>
<text x="30" y="48" class="lab">SQL</text>
<circle cx="66.6" cy="44" r="5" class="f-plpgsql"/>
<text x="75.6" y="48" class="lab">PL/pgSQL</text>
<circle cx="148.2" cy="44" r="5" class="f-plpython"/>
<text x="157.2" y="48" class="lab">PL/Python</text>
<circle cx="237.0" cy="44" r="5" class="f-plperl"/>
<text x="246.0" y="48" class="lab">PL/Perl</text>
<circle cx="311.4" cy="44" r="5" class="f-plzig"/>
<text x="320.4" y="48" class="lab">PL/Zig</text>
<line x1="230.0" y1="64" x2="230.0" y2="368" class="grid"/>
<text x="230.0" y="384" text-anchor="middle">0</text>
